<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海面高度シミュレーター(地球儀)</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; }
  #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; background: #000; }
  #panel {
    position: absolute; z-index: 1000; top: 12px; left: 12px;
    background: rgba(20, 24, 32, 0.88); color: #eee; padding: 14px 18px;
    border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.4);
    width: 300px; max-width: calc(100vw - 40px);
  }
  #panel h1 { font-size: 15px; margin: 0 0 10px; font-weight: 600; }
  #seaLevelValue { font-size: 22px; font-weight: 700; color: #7fd1ff; margin-bottom: 6px; }
  #slider { width: 100%; }
  .presets { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .presets button {
    flex: 1; min-width: 80px; background: #2a3140; color: #eee; border: 1px solid #444;
    border-radius: 6px; padding: 6px 4px; font-size: 12px; cursor: pointer;
  }
  .presets button:hover { background: #38455a; }
  .stepper { display: flex; gap: 6px; margin-top: 8px; }
  .stepper button {
    flex: 1; background: #2a3140; color: #eee; border: 1px solid #444;
    border-radius: 6px; padding: 6px 4px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .stepper button:hover { background: #38455a; }
  #status { font-size: 11px; color: #999; margin-top: 8px; min-height: 14px; }
  #attribution {
    position: absolute; z-index: 1000; bottom: 4px; right: 8px;
    font-size: 10px; color: #ccc; background: rgba(0,0,0,0.4); padding: 2px 6px; border-radius: 4px;
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>🌍 海面高度シミュレーター</h1>
  <div id="seaLevelValue">0 m</div>
  <input type="range" id="slider" min="-11000" max="8850" step="1" value="0">
  <div class="stepper">
    <button id="stepBigDown" title="-100m">◁◁</button>
    <button id="stepDown" title="-1m/-10m">◁</button>
    <button id="stepUp" title="+1m/+10m">▷</button>
    <button id="stepBigUp" title="+100m">▷▷</button>
  </div>
  <div class="presets">
    <button data-v="-11000">全て陸地</button>
    <button data-v="0">現在</button>
    <button data-v="8850">全て海</button>
  </div>
  <div id="status"></div>
</div>
<div id="attribution">標高データ: Terrarium (Mapzen / AWS Open Data)</div>

<script>
(function () {
  const TILE_SIZE = 256;
  const TERRAIN_URL = 'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png';
  const SOURCE_ID = 'elevation-source';
  const LAYER_ID = 'elevation-layer';

  let seaLevel = 0;
  const elevationCache = new Map(); // "z/x/y" -> Float32Array

  // --- 標高 -> 色 変換 ---
  // 陸地: 緑 → 砂漠の茶色（上限、白の雪冠にはしない）。海面が大きく下がって
  // 旧海底まで陸地になっても起伏が色で分かるよう、海面位置に関わらず
  // 「実際の標高」を基準に色分けする（海面基準の相対標高だと、海面を下げた分
  // だけ全体が一律に色の上限＝茶色に張り付いてしまうため）。
  const landStops = [
    [-11000, [90, 110, 88]],
    [-4000,  [92, 122, 84]],
    [-1000,  [80, 138, 78]],
    [0,      [70, 130, 70]],
    [300,    [128, 157, 82]],
    [800,    [173, 164, 110]],
    [2000,   [168, 132, 88]],
    [4000,   [150, 108, 76]], // これ以上の標高でもこの色で頭打ち
  ];
  // 海: 浅瀬の水色 → 深海の濃紺
  const oceanStops = [
    [0,     [175, 220, 232]],
    [200,   [110, 178, 210]],
    [1000,  [55, 130, 180]],
    [3000,  [25, 80, 145]],
    [6000,  [12, 45, 105]],
    [11000, [6, 20, 60]],
  ];

  function interp(stops, x) {
    if (x <= stops[0][0]) return stops[0][1];
    for (let i = 0; i < stops.length - 1; i++) {
      const [a, ca] = stops[i], [b, cb] = stops[i + 1];
      if (x <= b) {
        const t = (x - a) / (b - a);
        return [
          ca[0] + (cb[0] - ca[0]) * t,
          ca[1] + (cb[1] - ca[1]) * t,
          ca[2] + (cb[2] - ca[2]) * t,
        ];
      }
    }
    return stops[stops.length - 1][1]; // 上限で頭打ち
  }

  function colorFor(elev, sl) {
    if (elev <= sl) return interp(oceanStops, sl - elev);
    return interp(landStops, elev);
  }

  // 簡易ヒルシェード: 隣接ピクセルとの標高差から陰影係数を求め、
  // 同じ色帯の中でも尾根や谷などの凹凸を視認しやすくする。
  function shadeFactor(elevation, x, y, size, divisor) {
    const xm = x > 0 ? x - 1 : x, xp = x < size - 1 ? x + 1 : x;
    const ym = y > 0 ? y - 1 : y, yp = y < size - 1 ? y + 1 : y;
    const dzdx = elevation[y * size + xp] - elevation[y * size + xm];
    const dzdy = elevation[yp * size + x] - elevation[ym * size + x];
    const shade = -dzdx - dzdy; // 左上方向からの光を想定
    return 1 + Math.max(-0.3, Math.min(0.3, shade / divisor));
  }

  async function getElevationArray(z, x, y) {
    const key = z + '/' + x + '/' + y;
    if (elevationCache.has(key)) return elevationCache.get(key);

    const url = TERRAIN_URL.replace('{z}', z).replace('{x}', x).replace('{y}', y);
    const res = await fetch(url);
    if (!res.ok) throw new Error('tile fetch failed: ' + url);
    const blob = await res.blob();
    const bitmap = await createImageBitmap(blob);

    const off = document.createElement('canvas');
    off.width = TILE_SIZE; off.height = TILE_SIZE;
    const octx = off.getContext('2d');
    octx.drawImage(bitmap, 0, 0, TILE_SIZE, TILE_SIZE);
    const raw = octx.getImageData(0, 0, TILE_SIZE, TILE_SIZE).data;

    const elevation = new Float32Array(TILE_SIZE * TILE_SIZE);
    for (let i = 0; i < TILE_SIZE * TILE_SIZE; i++) {
      const r = raw[i * 4], g = raw[i * 4 + 1], b = raw[i * 4 + 2];
      elevation[i] = (r * 256 + g + b / 256) - 32768;
    }
    elevationCache.set(key, elevation);
    return elevation;
  }

  // --- カスタムプロトコル: elev://{z}/{x}/{y}?sl={seaLevel} ---
  maplibregl.addProtocol('elev', async (params) => {
    const m = params.url.match(/^elev:\/\/(\d+)\/(\d+)\/(\d+)\?sl=(-?[\d.]+)$/);
    if (!m) throw new Error('invalid elev url: ' + params.url);
    const z = Number(m[1]), x = Number(m[2]), y = Number(m[3]), sl = Number(m[4]);

    const elevation = await getElevationArray(z, x, y);

    const canvas = document.createElement('canvas');
    canvas.width = TILE_SIZE; canvas.height = TILE_SIZE;
    const ctx = canvas.getContext('2d');
    const imgData = ctx.createImageData(TILE_SIZE, TILE_SIZE);
    const data = imgData.data;
    // ズームが浅いほど1ピクセルあたりの実距離が大きく標高差も大きくなるため、
    // 陰影の感度(divisor)をズームに応じて調整する。
    const shadeDivisor = Math.max(3, 400 / Math.pow(2, z));
    for (let y = 0; y < TILE_SIZE; y++) {
      for (let x = 0; x < TILE_SIZE; x++) {
        const i = y * TILE_SIZE + x;
        const e = elevation[i];
        let [r, g, b] = colorFor(e, sl);
        if (e > sl) {
          const f = shadeFactor(elevation, x, y, TILE_SIZE, shadeDivisor);
          r *= f; g *= f; b *= f;
        }
        data[i * 4] = Math.max(0, Math.min(255, r));
        data[i * 4 + 1] = Math.max(0, Math.min(255, g));
        data[i * 4 + 2] = Math.max(0, Math.min(255, b));
        data[i * 4 + 3] = 255;
      }
    }
    ctx.putImageData(imgData, 0, 0);

    const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
    const buf = await blob.arrayBuffer();
    return { data: buf };
  });

  function tileTemplate(sl) {
    return 'elev://{z}/{x}/{y}?sl=' + sl;
  }

  const map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      sources: {
        [SOURCE_ID]: {
          type: 'raster',
          tiles: [tileTemplate(seaLevel)],
          tileSize: TILE_SIZE,
          minzoom: 0,
          maxzoom: 9,
          attribution: 'Terrarium (Mapzen / AWS Open Data)'
        }
      },
      layers: [
        { id: 'bg', type: 'background', paint: { 'background-color': '#000000' } },
        { id: LAYER_ID, type: 'raster', source: SOURCE_ID }
      ]
    },
    center: [138, 37],
    zoom: 2.2,
    minZoom: 1,
    maxZoom: 9,
    attributionControl: false,
  });

  map.addControl(new maplibregl.NavigationControl(), 'top-right');
  map.addControl(new maplibregl.AttributionControl({ compact: true }));

  map.on('load', () => {
    map.setProjection({ type: 'globe' });
    try {
      map.setSky({
        'sky-color': '#000000',
        'sky-horizon-blend': 0.5,
        'horizon-color': '#0a1020',
        'horizon-fog-blend': 0.5,
        'fog-color': '#0a1020',
        'fog-ground-blend': 0.5,
      });
    } catch (e) { /* sky未対応のバージョンは無視 */ }
  });

  // --- UI ---
  const slider = document.getElementById('slider');
  const valueLabel = document.getElementById('seaLevelValue');
  const status = document.getElementById('status');

  function setSeaLevel(v) {
    seaLevel = v;
    slider.value = v;
    valueLabel.textContent = (v >= 0 ? '+' : '') + Math.round(v) + ' m';
    const src = map.getSource(SOURCE_ID);
    if (src) src.setTiles([tileTemplate(seaLevel)]);
  }

  slider.addEventListener('input', (e) => setSeaLevel(Number(e.target.value)));
  document.querySelectorAll('.presets button').forEach((btn) => {
    btn.addEventListener('click', () => setSeaLevel(Number(btn.dataset.v)));
  });

  // ステップボタン: 海面付近(±10m未満)は1m刻み、それ以外は10m刻み。
  // ◁◁ / ▷▷ は常に100m刻み。
  const MIN_SL = -11000, MAX_SL = 8850;
  function stepAmount(big) {
    if (big) return 100;
    return Math.abs(seaLevel) < 10 ? 1 : 10;
  }
  function stepSeaLevel(dir, big) {
    const next = seaLevel + dir * stepAmount(big);
    setSeaLevel(Math.max(MIN_SL, Math.min(MAX_SL, next)));
  }
  document.getElementById('stepDown').addEventListener('click', () => stepSeaLevel(-1, false));
  document.getElementById('stepUp').addEventListener('click', () => stepSeaLevel(1, false));
  document.getElementById('stepBigDown').addEventListener('click', () => stepSeaLevel(-1, true));
  document.getElementById('stepBigUp').addEventListener('click', () => stepSeaLevel(1, true));

  let loadingCount = 0;
  map.on('dataloading', (e) => {
    if (e.sourceId === SOURCE_ID) { loadingCount++; status.textContent = '読み込み中...'; }
  });
  map.on('idle', () => { status.textContent = ''; });
  map.on('error', (e) => { status.textContent = 'エラーが発生しました(タイル取得失敗の可能性)'; console.error(e); });
})();
</script>
</body>
</html>
